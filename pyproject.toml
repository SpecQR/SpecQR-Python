[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "specqr-python"
version = "0.1.0rc1"
description = "Dependency-free, typed QR Code Model 2 generation for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SpecQR contributors"}]
dependencies = []
keywords = ["qr", "qrcode", "barcode", "gs1", "kanji", "svg", "png"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SpecQR/SpecQR-Python"
Repository = "https://github.com/SpecQR/SpecQR-Python"
Issues = "https://github.com/SpecQR/SpecQR-Python/issues"

[project.scripts]
specqr = "specqr.__main__:main"
