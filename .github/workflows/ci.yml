name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library test suite
        run: python -m unittest discover -s tests -v
      - name: Compile all sources
        run: python -m compileall -q src tools/verify_package.py build_backend.py
      - name: Clean wheel consumer and dependency audit
        run: python tools/verify_package.py
  independent:
    name: Independent conformance and decoders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SpecQR/SpecQR
          ref: 15ad15e5c770ea0e39072f8f88b2733018f02ffd
          path: .baseline/SpecQR
      - name: Install pinned test-only Node oracles
        run: npm ci --prefix tools/conformance --ignore-scripts
      - name: Exact owner and independent Nayuki conformance
        run: python tools/conformance/verify_conformance.py --baseline .baseline/SpecQR
      - name: jsQR matrix and actual PNG detection
        run: python tools/conformance/verify_jsqr.py
      - name: ZXing C++ strict detection and metadata
        run: python tools/conformance/verify_decoders.py --decoder cpp --dependency-dir .tools/zxing-cpp
      - name: ZXing Java strict detection and metadata
        run: python tools/conformance/verify_decoders.py --decoder java --dependency-dir .tools/zxing-java
      - name: Current TS URL contracts and strict native preservation
        run: python tools/url_serialization/verify.py
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-reports
          path: |
            artifacts/*.json
            artifacts/url-serialization.*
          if-no-files-found: error
  required:
    name: All required checks
    runs-on: ubuntu-latest
    needs: [portable, independent]
    if: always()
    steps:
      - name: Require every lane to pass
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          INDEPENDENT_RESULT: ${{ needs.independent.result }}
        run: test "$PORTABLE_RESULT" = success && test "$INDEPENDENT_RESULT" = success
